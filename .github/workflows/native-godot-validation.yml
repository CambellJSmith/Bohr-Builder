name: Native Godot Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-native-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import And Parse Project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --editor --path . --quit --verbose 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Could not parse global class|Could not resolve class|Could not resolve external class member" /tmp/godot-import.log; then
            echo "Godot reported a script parser/class resolution error during import."
            exit 1
          fi

      - name: Boot Native Main Scene
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path . --quit-after 5 --verbose 2>&1 | tee /tmp/godot-boot.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Could not parse global class|Could not resolve class|Could not resolve external class member" /tmp/godot-boot.log; then
            echo "Godot reported a script parser/class resolution error while booting the main scene."
            exit 1
          fi
